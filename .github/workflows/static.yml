name: CI/CD Pipeline

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "BUN_INSTALL=$HOME/.bun" >> $GITHUB_ENV
          echo "PATH=$BUN_INSTALL/bin:$PATH" >> $GITHUB_ENV

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build

      - name: Archive Build Artifacts
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          tar -czf build_${TIMESTAMP}.tar.gz dist/
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            dist/
            build_*.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Deployment Repository
        run: |
          git clone --branch deployments --single-branch ${{ secrets.DEPLOY_REPO }} deploy_repo

      - name: Clean and Copy Build Artifacts
        run: |
          rm -rf deploy_repo/*
          cp -r dist/* deploy_repo/

      - name: Commit and Push Deployment
        run: |
          cd deploy_repo
          git config user.name "${{ secrets.GIT_USERNAME }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          git add .
          git commit -m "Deploy static site - $(date)"
          git tag -a v$(date +%Y%m%d%H%M%S) -m "Deployment tag"
          git push -f origin deployments
          git push origin --tags

      - name: Copy Artifacts to Shared Storage
        if: env.FILE_SHARE_PATH != ''
        run: |
          if [ -d "${{ secrets.FILE_SHARE_PATH }}" ]; then
            echo "Copying build artifacts to file share..."
            TIMESTAMP=${{ env.TIMESTAMP }}
            mkdir -p ${{ secrets.FILE_SHARE_PATH }}/${TIMESTAMP}
            cp -r dist/* ${{ secrets.FILE_SHARE_PATH }}/${TIMESTAMP}/
            cp build_*.tar.gz ${{ secrets.FILE_SHARE_PATH }}/${TIMESTAMP}/
            ln -sf ${{ secrets.FILE_SHARE_PATH }}/${TIMESTAMP} ${{ secrets.FILE_SHARE_PATH }}/latest
            echo "Deployment files shared at: ${{ secrets.FILE_SHARE_PATH }}/${TIMESTAMP}"
            echo "Latest deployment symlink updated at: ${{ secrets.FILE_SHARE_PATH }}/latest"
          else
            echo "WARNING: File share path ${{ secrets.FILE_SHARE_PATH }} not available. Skipping file share deployment."
        env:
          FILE_SHARE_PATH: "${{ secrets.FILE_SHARE_PATH }}"
